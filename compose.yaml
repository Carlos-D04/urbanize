services:
  web: # web service responsible for the django api.
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  db: # service responsible for the database
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
  email_processor:
    build: .
    profiles: ["email-worker"]
    env_file:
      - .env
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        trap 'exit 0' TERM INT
        while true; do
          if ! python manage.py process_email_deliveries; then
            echo "Email delivery processing failed; retrying in 5 minutes." >&2
          fi
          sleep 300 &
          wait $$!
        done

volumes:
  postgres_data:
